<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
<radialGradient id="g1" cx="25%" cy="20%" r="80%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="85%" cy="90%" r="70%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15151f"/><stop offset="1" stop-color="#0b0b12"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="#050507"/><rect width="1600" height="1000" fill="url(#grid)"/>
<rect width="1600" height="1000" fill="url(#g1)"/><rect width="1600" height="1000" fill="url(#g2)"/>
<text x="110" y="190" font-family="Space Grotesk, Arial, sans-serif" font-size="34" fill="#a78bfa" letter-spacing="8">EDTECH · REAL-TIME · AI</text>
<text x="104" y="300" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="120" fill="#fff" letter-spacing="-4">Downhill</text>
<g transform="translate(640 330) rotate(-4)">
<rect width="860" height="560" rx="26" fill="url(#win)" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
<rect width="860" height="56" rx="26" fill="#1a1a26"/><rect y="30" width="860" height="26" fill="#1a1a26"/>
<circle cx="34" cy="28" r="9" fill="#ff5f57"/><circle cx="62" cy="28" r="9" fill="#febc2e"/><circle cx="90" cy="28" r="9" fill="#28c840"/>
<rect x="130" y="16" width="420" height="24" rx="12" fill="#0b0b12"/>
<rect x="24" y="80" width="150" height="456" rx="12" fill="#12121b"/>
<rect x="44" y="110" width="100" height="14" rx="7" fill="#8b5cf6" opacity=".8"/><rect x="44" y="140" width="80" height="12" rx="6" fill="#fff" opacity=".2"/><rect x="44" y="166" width="90" height="12" rx="6" fill="#fff" opacity=".2"/>
<g font-family="Consolas, monospace" font-size="20">
<text x="200" y="120" fill="#6b7280">// Two Sum — live room</text>
<text x="200" y="158" fill="#c792ea">function <tspan fill="#82aaff">twoSum</tspan><tspan fill="#d1d5db">(nums, t) {{</tspan></text>
<text x="230" y="196" fill="#c792ea">const <tspan fill="#d1d5db">seen = </tspan>new <tspan fill="#82aaff">Map</tspan><tspan fill="#d1d5db">();</tspan></text>
<text x="230" y="234" fill="#c792ea">for <tspan fill="#d1d5db">(let i = 0; i &lt; n; i++) {{</tspan></text>
<text x="260" y="272" fill="#c792ea">if <tspan fill="#d1d5db">(seen.has(t - nums[i]))</tspan></text>
<text x="290" y="310" fill="#c792ea">return <tspan fill="#d1d5db">[seen.get(t-nums[i]), i];</tspan></text>
<text x="260" y="348" fill="#d1d5db">seen.set(nums[i], i);</text>
<text x="230" y="386" fill="#d1d5db">}}</text><text x="200" y="424" fill="#d1d5db">}}</text></g>
<rect x="430" y="254" width="120" height="26" rx="6" fill="#f472b6"/><text x="442" y="273" font-family="Arial" font-size="15" fill="#000">collaborator</text>
<rect x="610" y="80" width="226" height="456" rx="12" fill="#12121b"/>
<text x="632" y="116" font-family="Arial" font-size="18" fill="#fff" font-weight="700">● AI Tutor</text>
<rect x="650" y="140" width="166" height="60" rx="14" fill="#232334"/><rect x="630" y="216" width="190" height="96" rx="14" fill="#8b5cf6" opacity=".35"/>
<text x="646" y="248" font-family="Arial" font-size="15" fill="#fff">Nested loops → O(n²).</text><text x="646" y="272" font-family="Arial" font-size="15" fill="#fff">Use a hash map → O(n)</text>
</g></svg>